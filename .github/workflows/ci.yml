# Continuous integration: runs on every push and pull request.
# Two jobs run in parallel; a red X on GitHub means one of them failed.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # A real PostgreSQL, same major version as production (render.yaml).
    # The tests need it: the double-booking rule is a PostgreSQL exclusion
    # constraint, which SQLite or mocks couldn't check.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: booking_user
          POSTGRES_PASSWORD: booking_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Wait until the database accepts connections before running steps.
        options: >-
          --health-cmd "pg_isready -U booking_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      # tests/conftest.py creates and drops booking_test_db through the admin URL.
      TEST_DATABASE_URL: postgresql+psycopg://booking_user:booking_password@localhost:5432/booking_test_db
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://booking_user:booking_password@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
